services:
  minio:
    image: minio/minio:latest
    container_name: plantx-s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - plantx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc:latest
    container_name: plantx-s3-init
    depends_on:
      - minio
    networks:
      - plantx
    entrypoint: /bin/sh
    command: >
      -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/plant-quality --ignore-existing;
      mc anonymous set public myminio/plant-quality;
      echo 'MinIO bucket plant-quality is ready';
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: plantx-mail
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - plantx

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantx-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    networks:
      - plantx

networks:
  plantx:
    name: plantx

volumes:
  minio_data:
    name: plantx_minio_data