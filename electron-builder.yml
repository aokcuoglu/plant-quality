appId: com.plantquality.desktop
productName: PlantQuality
directories:
  app: apps/desktop/dist
  output: apps/desktop/release
files:
  - main.js
  - preload.js
  - node_modules/**/*
asarUnpack:
  - node_modules/embedded-postgres/**/*
  - node_modules/@embedded-postgres/**/*
extraResources:
  - from: app
    to: app
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true